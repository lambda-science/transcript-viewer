[project]
name = "transcript-viewer"
version = "0.16.1"
description = "Browse agent transcripts in a local, dependency-free web viewer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The only dependency is the converter. The viewer itself is stdlib http.server
# plus one self-contained HTML page.
# The floor is not politeness: this viewer imports atif_make.container, which
# is how a benchmark published as one JSON array of a thousand runs becomes a
# thousand sessions. An older atif-make fails to import at all.
# 0.8.0 is where a Claude Code session that delegated more than one level deep
# started converting to a tree. Against an older one the chart still draws, and
# draws a flat row of subagents that nothing spawned — which reads as the
# viewer being broken rather than the converter being old.
dependencies = ["atif-make>=0.8.0"]

[project.scripts]
transcript-viewer = "transcript_viewer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
