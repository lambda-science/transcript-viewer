name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The page's behaviour is JavaScript; its tests run under node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv python install ${{ matrix.python-version }}
      # Include the SDK boundary tests; the PostgreSQL integration test remains
      # optional because CI does not provision a database.
      - name: Run tests
        run: uv run --no-sources --python ${{ matrix.python-version }} --extra ai pytest -q
